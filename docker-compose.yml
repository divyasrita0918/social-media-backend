services:
  backend:
    build: .
    container_name: social-media-backend

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:17
    container_name: my-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social_media

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:8
    container_name: my-redis

    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: my-minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    command: server /data --console-address ":9001"

    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
